[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpc-lb"
version = "0.1.0"
description = "Distributed gRPC workload services with Envoy ingress and xDS lookaside load balancing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pin runtime và tools cùng version đã kiểm chứng để sinh proto tái lập được.
    # Nếu muốn nâng cấp: đổi cả 3 grpcio* cùng lúc, rồi chạy scripts/gen_proto.py
    "grpcio==1.84.0",
    "grpcio-health-checking==1.84.0",
    # protobuf: grpcio-health-checking 1.84.0 yêu cầu >=7.35.1,<8.0
    # Mã sinh hiện dùng Protobuf 7.35.1; runtime phải bằng hoặc mới hơn.
    "protobuf==7.36.2",
    "xds-protos==1.84.0",
    "httpx==0.28.1",
]

[project.scripts]
grpc-lb-service = "grpc_lb.microservices:main"
grpc-lb-controlplane = "grpc_lb.controlplane.__main__:main"

[project.optional-dependencies]
cloud = [
    # Operator tooling only; credentials never enter container images/releases.
    "requests>=2.32,<3",
    "PyYAML>=6,<7",
]
dev = [
    # grpcio-tools PHẢI cùng version với grpcio runtime để sinh code tương thích
    "grpcio-tools==1.84.0",
    # Testing
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff==0.17.2",
]

# -- Hatch build config -------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/grpc_lb"]

# -- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# -- Proto code generation ----------------------------------------------------
# Tái lập được bằng cách chạy:
#   python -m pip install -e ".[dev]"        # cài grpcio-tools cùng version
#   python scripts/gen_proto.py              # sinh lại, tự patch import
#
# Hoặc thủ công:
#   python -m grpc_tools.protoc \
#       -I api \
#       --python_out=src/grpc_lb/generated \
#       --grpc_python_out=src/grpc_lb/generated \
#       api/workload.proto
#
# Sau khi sinh: workload_pb2_grpc.py sẽ có GRPC_GENERATED_VERSION='1.84.0'
# phù hợp với grpcio==1.84.0 đã khai báo ở trên.
[tool.grpc]
proto_dir = "api"
out_dir = "src/grpc_lb/generated"
proto_files = ["workload.proto", "processing.proto"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["src/grpc_lb/generated", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
