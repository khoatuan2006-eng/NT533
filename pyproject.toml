[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpc-lb"
version = "0.1.0"
description = "gRPC client-side load balancing experiment — M1 foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pin runtime và tools cùng một minor version để sinh proto tái lập được.
    # Nếu muốn nâng cấp: đổi cả 3 grpcio* cùng lúc, rồi chạy scripts/gen_proto.py
    "grpcio>=1.71.2,<1.72",
    "grpcio-health-checking>=1.71.2,<1.72",
    # protobuf: grpcio-health-checking 1.71.2 yêu cầu >=5.26.1,<6.0
    # Mã sinh hiện dùng Protobuf 5.29.0; runtime phải bằng hoặc mới hơn.
    "protobuf>=5.29.0,<6",
]

[project.optional-dependencies]
dev = [
    # grpcio-tools PHẢI cùng version với grpcio runtime để sinh code tương thích
    "grpcio-tools>=1.71.2,<1.72",
    # Testing
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

# -- Hatch build config -------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/grpc_lb"]

# -- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# -- Proto code generation ----------------------------------------------------
# Tái lập được bằng cách chạy:
#   python -m pip install -e ".[dev]"        # cài grpcio-tools cùng version
#   python scripts/gen_proto.py              # sinh lại, tự patch import
#
# Hoặc thủ công:
#   python -m grpc_tools.protoc \
#       -I api \
#       --python_out=src/grpc_lb/generated \
#       --grpc_python_out=src/grpc_lb/generated \
#       api/workload.proto
#
# Sau khi sinh: workload_pb2_grpc.py sẽ có GRPC_GENERATED_VERSION='1.71.2'
# phù hợp với grpcio>=1.71.2 đã khai báo ở trên.
[tool.grpc]
proto_dir = "api"
out_dir = "src/grpc_lb/generated"
proto_files = ["workload.proto"]
