<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Bố trí thành phần trên bốn node</title>
  <desc>Bốn VM c7i-flex.large. Node 1 chạy consul-1, controlplane-1, envoy-1, a-1, b-1. Node 2 chạy consul-2, controlplane-2, envoy-2, a-2, c-1. Node 3 chạy consul-3, a-3, b-2. Node 4 chạy Consul agent, a-4, c-2 và bộ đo, gọi cả hai Envoy.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 14px; dominant-baseline: central; text-anchor: middle; }
    .h { font-size: 14px; font-weight: 600; dominant-baseline: central; text-anchor: middle; }
    .node rect { fill: #444441; stroke: #888780; stroke-width: 0.5; }
    .node text { fill: #D3D1C7; }
    .data rect { fill: #085041; stroke: #5DCAA5; stroke-width: 0.5; }
    .data text { fill: #9FE1CB; }
    .ctl rect { fill: #3C3489; stroke: #AFA9EC; stroke-width: 0.5; }
    .ctl text { fill: #CECBF6; }
    .gen rect { fill: #2C2C2A; stroke: #5F5E5A; stroke-width: 0.5; }
    .gen text { fill: #F1EFE8; }
    .legend { fill: #B4B2A9; font-size: 12px; dominant-baseline: central; }
  </style>

  <rect x="0" y="0" width="880" height="400" rx="12" fill="#1F1F1E"/>

  <g class="node"><rect x="30" y="30" width="190" height="250" rx="12"/><text class="h" x="125" y="48">node1</text></g>
  <g class="ctl"><rect x="50" y="66" width="150" height="32" rx="6"/><text class="t" x="125" y="82">consul-1</text></g>
  <g class="ctl"><rect x="50" y="106" width="150" height="32" rx="6"/><text class="t" x="125" y="122">controlplane-1</text></g>
  <g class="data"><rect x="50" y="146" width="150" height="32" rx="6"/><text class="t" x="125" y="162">envoy-1</text></g>
  <g class="data"><rect x="50" y="186" width="150" height="32" rx="6"/><text class="t" x="125" y="202">a-1</text></g>
  <g class="data"><rect x="50" y="226" width="150" height="32" rx="6"/><text class="t" x="125" y="242">b-1</text></g>

  <g class="node"><rect x="240" y="30" width="190" height="250" rx="12"/><text class="h" x="335" y="48">node2</text></g>
  <g class="ctl"><rect x="260" y="66" width="150" height="32" rx="6"/><text class="t" x="335" y="82">consul-2</text></g>
  <g class="ctl"><rect x="260" y="106" width="150" height="32" rx="6"/><text class="t" x="335" y="122">controlplane-2</text></g>
  <g class="data"><rect x="260" y="146" width="150" height="32" rx="6"/><text class="t" x="335" y="162">envoy-2</text></g>
  <g class="data"><rect x="260" y="186" width="150" height="32" rx="6"/><text class="t" x="335" y="202">a-2</text></g>
  <g class="data"><rect x="260" y="226" width="150" height="32" rx="6"/><text class="t" x="335" y="242">c-1</text></g>

  <g class="node"><rect x="450" y="30" width="190" height="250" rx="12"/><text class="h" x="545" y="48">node3</text></g>
  <g class="ctl"><rect x="470" y="66" width="150" height="32" rx="6"/><text class="t" x="545" y="82">consul-3</text></g>
  <g class="data"><rect x="470" y="186" width="150" height="32" rx="6"/><text class="t" x="545" y="202">a-3</text></g>
  <g class="data"><rect x="470" y="226" width="150" height="32" rx="6"/><text class="t" x="545" y="242">b-2</text></g>

  <g class="node"><rect x="660" y="30" width="190" height="250" rx="12"/><text class="h" x="755" y="48">node4</text></g>
  <g class="ctl"><rect x="680" y="66" width="150" height="32" rx="6"/><text class="t" x="755" y="82">consul agent</text></g>
  <g class="data"><rect x="680" y="186" width="150" height="32" rx="6"/><text class="t" x="755" y="202">a-4</text></g>
  <g class="data"><rect x="680" y="226" width="150" height="32" rx="6"/><text class="t" x="755" y="242">c-2</text></g>

  <g class="gen"><rect x="200" y="320" width="300" height="44" rx="8"/><text class="h" x="350" y="342">Bộ đo (chạy trên node4)</text></g>
  <line x1="260" y1="320" x2="125" y2="284" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="350" y1="320" x2="335" y2="284" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="500" y1="342" x2="755" y2="284" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="620" y="320" width="14" height="14" rx="3" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="legend" x="642" y="327">Discovery, cấu hình</text>
  <rect x="620" y="344" width="14" height="14" rx="3" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="legend" x="642" y="351">Đường request</text>
</svg>
