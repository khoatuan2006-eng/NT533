# Standalone stack; does not merge with or change the M1 compose project.
name: loadbalance-ingress

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &backend-env
    SERVICE_DELAY_S: "0.005"
    MAX_CONCURRENCY: "50"
    PORT: "50051"
  restart: unless-stopped
  # Backend ports are private to this Compose network.

services:
  replica-1:
    <<: *backend
    environment:
      <<: *backend-env
      BACKEND_ID: replica-1
  replica-2:
    <<: *backend
    environment:
      <<: *backend-env
      BACKEND_ID: replica-2
  replica-3:
    <<: *backend
    environment:
      <<: *backend-env
      BACKEND_ID: replica-3
  ingress:
    image: envoyproxy/envoy:v1.35.5
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info", "--concurrency", "2"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:50050:50050"
      - "127.0.0.1:9901:9901"
    depends_on:
      - replica-1
      - replica-2
      - replica-3
    restart: unless-stopped
