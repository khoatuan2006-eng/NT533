# Lab only. Combine with compose.microservices.yaml and compose.lookaside.yaml.
# One caller writes telemetry; the single xDS control plane reads the same volume.
services:
  controlplane:
    environment:
      EXPERIMENTAL_RL_TELEMETRY: /rl/worker.json
      EXPERIMENTAL_RL_SERVICE: service-b
      EXPERIMENTAL_RL_MODEL: /rl-model/model.json
    volumes:
      - rl-telemetry:/rl:ro
      - ../results/rl-convergence-balanced-20261101/model-7.json:/rl-model/model.json:ro
  a-1:
    environment:
      EXPERIMENTAL_RL_TELEMETRY_OUTPUT: /rl/worker.json
      EXPERIMENTAL_RL_SERVICE: service-b
    volumes:
      - rl-telemetry:/rl

volumes:
  rl-telemetry:
