# Overlay: docker compose -f deploy/compose.microservices.yaml -f deploy/compose.lookaside.yaml up --build
services:
  controlplane:
    image: loadbalance-controlplane:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controlplane
    volumes:
      - ../configs/discovery.compose.json:/config/discovery.json:ro
    depends_on: [b-1, b-2, c-1, c-2]
    restart: unless-stopped
  a-1:
    environment:
      DISCOVERY_MODE: xds
      GRPC_XDS_BOOTSTRAP: /app/configs/xds-bootstrap.json
    volumes:
      - ../configs/xds-bootstrap.compose.json:/app/configs/xds-bootstrap.json:ro
    depends_on: [controlplane]
  a-2:
    environment:
      DISCOVERY_MODE: xds
      GRPC_XDS_BOOTSTRAP: /app/configs/xds-bootstrap.json
    volumes:
      - ../configs/xds-bootstrap.compose.json:/app/configs/xds-bootstrap.json:ro
    depends_on: [controlplane]
