# Local development ingress: plaintext HTTP/2. Add TLS before public deployment.
static_resources:
  listeners:
    - name: grpc_ingress
      address:
        socket_address: {address: 0.0.0.0, port_value: 50050}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_grpc
                codec_type: AUTO
                http2_protocol_options: {}
                stream_idle_timeout: 60s
                route_config:
                  name: entry_routes
                  virtual_hosts:
                    - name: entry
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/processing.v1.ProcessingService/"}
                          route:
                            cluster: entry_backends
                            # Envoy RouteAction.MaxStreamDuration: enforce grpc-timeout explicitly.
                            timeout: 0s
                            max_stream_duration:
                              max_stream_duration: 5s
                              grpc_timeout_header_max: 5s
                              grpc_timeout_header_offset: 0.010s
                            # No retry policy: Execute is not declared idempotent.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          start_time: "%START_TIME%"
                          method: "%REQ(:PATH)%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          upstream: "%UPSTREAM_HOST%"
                          duration_ms: "%DURATION%"
                          http_status: "%RESPONSE_CODE%"
                          grpc_status: "%GRPC_STATUS%"
                          response_flags: "%RESPONSE_FLAGS%"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: entry_backends
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 16
            max_pending_requests: 32
            max_requests: 100
            max_retries: 0
            track_remaining: true
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      common_lb_config:
        # Fail closed when every endpoint is unhealthy instead of panic routing.
        healthy_panic_threshold: {value: 0}
      health_checks:
        - timeout: 0.5s
          interval: 1s
          no_traffic_interval: 1s
          unhealthy_threshold: 2
          healthy_threshold: 2
          grpc_health_check:
            service_name: processing.v1.ProcessingService/service-a
      load_assignment:
        cluster_name: entry_backends
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: a-1, port_value: 50051}
              - endpoint:
                  address:
                    socket_address: {address: a-2, port_value: 50051}
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}
