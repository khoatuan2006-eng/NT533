name: loadbalance-microservices

x-service: &service
  image: loadbalance-workload:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  command: ["python", "-m", "grpc_lb.microservices"]
  volumes:
    - ../configs/topology.compose.json:/app/configs/topology.json:ro
  restart: unless-stopped

x-env: &env
  TOPOLOGY_PATH: /app/configs/topology.json
  LISTEN_ADDRESS: "[::]:50051"

services:
  b-1:
    <<: *service
    environment:
      <<: *env
      SERVICE_ID: service-b
      INSTANCE_ID: b-1
  b-2:
    <<: *service
    environment:
      <<: *env
      SERVICE_ID: service-b
      INSTANCE_ID: b-2
  c-1:
    <<: *service
    environment:
      <<: *env
      SERVICE_ID: service-c
      INSTANCE_ID: c-1
  c-2:
    <<: *service
    environment:
      <<: *env
      SERVICE_ID: service-c
      INSTANCE_ID: c-2
  a-1:
    <<: *service
    environment:
      <<: *env
      SERVICE_ID: service-a
      INSTANCE_ID: a-1
    depends_on: [b-1, b-2, c-1, c-2]
  a-2:
    <<: *service
    environment:
      <<: *env
      SERVICE_ID: service-a
      INSTANCE_ID: a-2
    depends_on: [b-1, b-2, c-1, c-2]
  ingress:
    image: envoyproxy/envoy:v1.35.5
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info", "--concurrency", "2"]
    volumes:
      - ./envoy.microservices.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:50050:50050"
      - "127.0.0.1:9901:9901"
    depends_on: [a-1, a-2]
    restart: unless-stopped
