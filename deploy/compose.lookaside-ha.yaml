# Overlay on compose.microservices.yaml. Consul is the shared registry/health source.
x-consul: &consul
  image: hashicorp/consul:2.1.0
  restart: unless-stopped
  environment:
    CONSUL_BIND_INTERFACE: eth0

x-controlplane: &controlplane
  image: loadbalance-controlplane:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile.controlplane
  environment:
    CONSUL_HTTP_ADDR: http://consul-agent:8500
    CONSUL_ACTIVE_HEALTH: "1"
  volumes:
    - ../configs/discovery.registry.json:/config/discovery.json:ro
  networks:
    default:
      aliases: [xds-controlplane]
  depends_on: [consul-agent]
  restart: unless-stopped

x-registration: &registration
  CONSUL_HTTP_ADDR: http://consul-agent:8500
  DRAIN_FILE: /tmp/drain

services:
  consul-1:
    <<: *consul
    command: [agent, -server, -bootstrap-expect=3, -node=consul-1, -client=0.0.0.0, -datacenter=lb-lab, -retry-join=consul-2, -retry-join=consul-3]
    volumes: [consul-1:/consul/data, "../configs/consul-ha.json:/consul/config/ha-profile.json:ro"]
  consul-2:
    <<: *consul
    command: [agent, -server, -bootstrap-expect=3, -node=consul-2, -client=0.0.0.0, -datacenter=lb-lab, -retry-join=consul-1, -retry-join=consul-3]
    volumes: [consul-2:/consul/data, "../configs/consul-ha.json:/consul/config/ha-profile.json:ro"]
  consul-3:
    <<: *consul
    command: [agent, -server, -bootstrap-expect=3, -node=consul-3, -client=0.0.0.0, -datacenter=lb-lab, -retry-join=consul-1, -retry-join=consul-2]
    volumes: [consul-3:/consul/data, "../configs/consul-ha.json:/consul/config/ha-profile.json:ro"]
  consul-agent:
    <<: *consul
    command: [agent, -node=workload-host, -client=0.0.0.0, -datacenter=lb-lab, -retry-join=consul-1, -retry-join=consul-2, -retry-join=consul-3]
    volumes: [consul-agent:/consul/data, "../configs/consul-ha.json:/consul/config/ha-profile.json:ro"]
    depends_on: [consul-1, consul-2, consul-3]
  controlplane-1:
    <<: *controlplane
  controlplane-2:
    <<: *controlplane
  b-1:
    environment: *registration
    depends_on: [consul-agent]
  b-2:
    environment: *registration
    depends_on: [consul-agent]
  c-1:
    environment: *registration
    depends_on: [consul-agent]
  c-2:
    environment: *registration
    depends_on: [consul-agent]
  a-1:
    environment:
      <<: *registration
      DISCOVERY_MODE: xds
      GRPC_XDS_BOOTSTRAP: /app/configs/xds-bootstrap.json
    volumes:
      - ../configs/xds-bootstrap.ha.json:/app/configs/xds-bootstrap.json:ro
    depends_on: [controlplane-1, controlplane-2]
  a-2:
    environment:
      <<: *registration
      DISCOVERY_MODE: xds
      GRPC_XDS_BOOTSTRAP: /app/configs/xds-bootstrap.json
    volumes:
      - ../configs/xds-bootstrap.ha.json:/app/configs/xds-bootstrap.json:ro
    depends_on: [controlplane-1, controlplane-2]

volumes:
  consul-1:
  consul-2:
  consul-3:
  consul-agent:
