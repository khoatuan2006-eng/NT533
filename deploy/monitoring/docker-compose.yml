# Prometheus + Grafana monitoring stack for grpc-lb.
# Runs on your LOCAL machine, scrapes metrics from the AWS cluster via SSH tunnel or public IP.
#
# Usage:
#   1. Set up SSH tunnels (see README.md in this directory) or open ports in AWS Security Group.
#   2. Edit prometheus/prometheus.yml with the correct target IPs/ports.
#   3. Run:  docker compose -f deploy/monitoring/docker-compose.yml up -d
#   4. Open Grafana at http://localhost:3000 (admin / admin).

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: grpc-lb-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grpc-lb-grafana
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/grpc-lb-overview.json
      # Allow embedding in iframes (useful if you build a control panel later).
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
