# Chạy Prometheus & Grafana với network_mode: host trên AWS Node 1
# Nhờ đó Prometheus có thể truy cập thẳng Envoy admin tại 127.0.0.1:9901 mà không bị chặn bởi Docker bridge.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: grpc-lb-prometheus
    network_mode: host
    volumes:
      - ./prometheus/prometheus.aws.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grpc-lb-grafana
    network_mode: host
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
